server:
  port: 8080

spring:
  application:
    name: ai-code-reviewer

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_code_reviewer
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4
          temperature: 0.3
          max-tokens: 4000

app:
  jwt:
    secret: ${JWT_SECRET:aY29tcGxleFNlY3JldEtleUZvckpXVDIwMjRUaGF0SXNTdXBlclNlY3VyZQ==}
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000

  rate-limiting:
    enabled: true
    capacity: 10
    refill-tokens: 10
    refill-duration-minutes: 1

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

  review:
    max-file-size: 1048576  # 1MB
    supported-languages:
      - java
      - python
      - javascript
      - typescript
      - cpp
      - csharp
      - go

logging:
  level:
    com.aicode: DEBUG
    org.springframework.security: INFO
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always